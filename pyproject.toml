[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syntrends"
version = "0.1.0"
description = "Python SDK for the SynTrends Agent API (STP/1.0 over HTTP + SSE)"
readme = "sdk/python/README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "SynTrends" }]
keywords = ["syntrends", "seepnews", "stp", "agent-api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Surrplexie/st"
Documentation = "https://github.com/Surrplexie/st/blob/main/docs/AGENT_QUICKSTART.md"
Repository = "https://github.com/Surrplexie/st"
Changelog = "https://github.com/Surrplexie/st/blob/main/CHANGELOG.md"
Issues = "https://github.com/Surrplexie/st/issues"

[tool.setuptools.packages.find]
where = ["sdk/python", "."]
include = ["syntrends", "chain*"]

[tool.setuptools.package-data]
syntrends = ["py.typed"]
chain = ["py.typed"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "build>=1.0", "twine>=5.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
