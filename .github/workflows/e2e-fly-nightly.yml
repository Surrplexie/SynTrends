name: E2E Fly testnet

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: E2E
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PERSONA_WEBHOOK_SECRET: ${{ secrets.PERSONA_WEBHOOK_SECRET }}
          SYNTRENDS_URL: ${{ vars.SYNTRENDS_E2E_URL || 'https://testnet.syntrends.com' }}
          FLY_APP: syntrends-testnet
          E2E_WAIT_SECONDS: "180"
          E2E_CHECK_PAUSE: "1"
        run: bash scripts/ci_fly_e2e.sh
      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --label testnet-e2e --state open --json number --jq '.[0].number' | grep -q . && exit 0
          gh issue create --title "Nightly Fly E2E failed" --label "testnet-e2e" \
            --body "Scheduled E2E on ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed. See docs/OPS.md."
