# Public testnet: Postgres + app (SYNTRENDS_ENV=testnet) + Caddy TLS.
#
#   cp deploy/testnet/.env.example deploy/testnet/.env
#   docker compose -f deploy/testnet/docker-compose.testnet.yml --env-file deploy/testnet/.env up -d --build
#
# Then seed genesis (once):
#   docker compose -f deploy/testnet/docker-compose.testnet.yml exec app \
#     python -m demo.seed_testnet

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: syntrends
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syntrends}
      POSTGRES_DB: syntrends_testnet
    volumes:
      - pgdata_testnet:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syntrends"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "demo.run_testnet"]
    environment:
      SYNTRENDS_ENV: testnet
      NETWORK_NAME: syntrends-testnet-1
      DATABASE_URL: postgresql://syntrends:${POSTGRES_PASSWORD:-syntrends}@db:5432/syntrends_testnet
      CORS_ORIGINS: ${CORS_ORIGINS:-https://testnet.syntrends.com,https://owners.testnet.syntrends.com}
      FAUCET_ENABLED: ${FAUCET_ENABLED:-1}
      FAUCET_AMOUNT: ${FAUCET_AMOUNT:-5000}
      FAUCET_COOLDOWN_SECONDS: ${FAUCET_COOLDOWN_SECONDS:-3600}
      KYC_PROVIDER: ${KYC_PROVIDER:-persona}
      REQUIRE_REAL_KYC_ON_TESTNET: ${REQUIRE_REAL_KYC_ON_TESTNET:-1}
      PERSONA_API_KEY: ${PERSONA_API_KEY:-}
      PERSONA_WEBHOOK_SECRET: ${PERSONA_WEBHOOK_SECRET:-}
      PERSONA_TEMPLATE_ID: ${PERSONA_TEMPLATE_ID:-}
      PERSONA_ENVIRONMENT: ${PERSONA_ENVIRONMENT:-sandbox}
      ALLOW_DEMO_KYC_APPROVE: ${ALLOW_DEMO_KYC_APPROVE:-0}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8090"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata_testnet:
  caddy_data:
  caddy_config:
